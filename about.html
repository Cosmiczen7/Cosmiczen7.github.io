  <!-- SVG Optical Refraction Filter from liqui-design -->
  <svg style="position: absolute; width: 0; height: 0; overflow: hidden;" aria-hidden="true">
    <filter id="button-liquid-filter" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" result="noise" />
      <feGaussianBlur in="noise" stdDeviation="8" result="smoothedNoise" />
      <feDisplacementMap in="SourceGraphic" in2="smoothedNoise" scale="22" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>

  <!-- Windows 7 Wallpaper Slideshow Engine -->
  <div id="wallpaper-engine" aria-hidden="true">
    <div id="slide-a" class="wallpaper-slide active" style="background-image: url('assets/blue_back.jpg');"></div>
    <div id="slide-b" class="wallpaper-slide inactive"></div>
  </div>
